name: insar

# Blok 2: started by hand from the Actions tab. The quarterly schedule is added in Blok 6.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "submit = kirim pasangan ke HyP3, download = ambil hasil yang sudah jadi"
        type: choice
        options: [submit, download]
        default: submit
      dry_run:
        description: "submit saja: hitung pasangan tanpa mengirim"
        type: boolean
        default: true

jobs:
  insar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/fetch_insar_check.py
      - name: submit
        if: inputs.step == 'submit'
        run: python pipeline/fetch_insar.py submit ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: download
        if: inputs.step == 'download'
        run: |
          start=$(date +%s)
          python pipeline/fetch_insar.py download
          echo "waktu unduh: $(( $(date +%s) - start )) detik"
          df -h .
