name: insar

# Blok 2: started by hand from the Actions tab, plus a status check every 6 hours that opens
# an issue (notification + email to the owner) once HyP3 has finished every pair.
# The quarterly re-run is added in Blok 6.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      step:
        description: "submit = kirim pasangan ke HyP3, status = cek progres, process = unduh + MintPy"
        type: choice
        options: [submit, status, process]
        default: status
      dry_run:
        description: "submit saja: hitung pasangan tanpa mengirim"
        type: boolean
        default: true
      end_date:
        description: "process saja, kosongkan untuk run biasa. Isi 20171231 untuk Uji Mundur"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  insar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      STEP: ${{ inputs.step || 'status' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/fetch_insar_check.py

      - name: submit
        if: env.STEP == 'submit'
        run: python pipeline/fetch_insar.py submit ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: status
        id: status
        if: env.STEP == 'status'
        run: python pipeline/fetch_insar.py status
      - name: kabari kalau HyP3 selesai
        if: steps.status.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "HyP3 selesai: jalankan insar → process"
        run: |
          if [ -z "$(gh issue list --state all --search "in:title \"$TITLE\"" --json number -q '.[].number')" ]; then
            gh issue create --title "$TITLE" --body "${{ steps.status.outputs.summary }}. Buka Actions → insar → Run workflow → step: process. Hasil HyP3 dihapus 14 hari setelah selesai."
          fi

      - name: pasang GDAL + MintPy
        if: env.STEP == 'process'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin libgdal-dev
          # MintPy first, so numpy is final. Then GDAL is built against that numpy,
          # otherwise osgeo.gdal_array is missing. The check fails fast, before the 6+ GB download.
          pip install mintpy setuptools wheel
          pip install --no-build-isolation --no-cache-dir "GDAL[numpy]==$(gdal-config --version)"
          python -c "from osgeo import gdal_array; print('GDAL + numpy ok')"
      - name: process
        if: env.STEP == 'process'
        run: |
          start=$(date +%s)
          python pipeline/fetch_insar.py download
          df -h .
          python pipeline/fetch_insar.py timeseries ${{ inputs.end_date && format('--end-date {0}', inputs.end_date) || '' }}
          echo "waktu total: $(( $(date +%s) - start )) detik"
          df -h .
      - uses: actions/upload-artifact@v4
        if: env.STEP == 'process'
        with:
          name: subsidence-rate${{ inputs.end_date && format('-until-{0}', inputs.end_date) || '' }}
          path: |
            pipeline/work/subsidence_rate*.tif
            pipeline/work/mintpy/pic/
